<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636a"/>
    </marker>
    <marker id="arrow-ember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d23f1d"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1e2326">Jharia Fire Watch on AWS</text>
  <text x="40" y="68" font-size="13" fill="#59636a">One Graviton instance, two containers. Everything the agent sees and does is stored and traced.</text>

  <text x="40" y="112" font-size="12" font-weight="600" fill="#59636a" letter-spacing="0.4">Open data</text>
  <g font-size="12" fill="#59636a">
    <rect x="40" y="124" width="230" height="64" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="54" y="150" font-size="14" font-weight="600" fill="#1e2326">Landsat 8/9 Collection 2</text>
    <text x="54" y="171">s3://usgs-landsat, requester pays</text>

    <rect x="40" y="212" width="230" height="64" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="54" y="238" font-size="14" font-weight="600" fill="#1e2326">USGS new-scene topic</text>
    <text x="54" y="259">SNS public-c2-notify-v2</text>

    <rect x="40" y="300" width="230" height="64" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="54" y="326" font-size="14" font-weight="600" fill="#1e2326">Sentinel-2 L2A</text>
    <text x="54" y="347">Earth Search STAC, 20 m SWIR</text>

    <rect x="40" y="388" width="230" height="64" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="54" y="414" font-size="14" font-weight="600" fill="#1e2326">OpenStreetMap</text>
    <text x="54" y="435">roads, haul roads, plants</text>
  </g>

  <rect x="306" y="212" width="160" height="64" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
  <text x="320" y="238" font-size="14" font-weight="600" fill="#1e2326">SQS scene queue</text>
  <text x="320" y="259" font-size="12" fill="#59636a">dead letters after 3 tries</text>

  <rect x="500" y="96" width="370" height="584" rx="10" fill="#f1f2ef" stroke="#59636a" stroke-dasharray="5 4"/>
  <text x="518" y="120" font-size="13" font-weight="600" fill="#1e2326">EC2 Graviton (arm64), Docker</text>

  <rect x="516" y="134" width="338" height="380" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
  <text x="532" y="158" font-size="13" font-weight="600" fill="#3f6e8c">Worker container: firewatch worker</text>
  <g font-size="12" fill="#59636a">
    <rect x="532" y="170" width="306" height="58" rx="5" fill="#fbfbf9" stroke="#dfe1dc"/>
    <text x="546" y="193" font-size="13" font-weight="600" fill="#1e2326">1  Land surface temperature</text>
    <text x="546" y="213">band 10 radiance to LST, NDVI emissivity</text>

    <rect x="532" y="236" width="306" height="58" rx="5" fill="#fbfbf9" stroke="#dfe1dc"/>
    <text x="546" y="259" font-size="13" font-weight="600" fill="#1e2326">2  Align to the reference pass</text>
    <text x="546" y="279">SIFT, checked every pass by ALIKED + LightGlue</text>

    <rect x="532" y="302" width="306" height="58" rx="5" fill="#fbfbf9" stroke="#dfe1dc"/>
    <text x="546" y="325" font-size="13" font-weight="600" fill="#1e2326">3  Hotspots</text>
    <text x="546" y="345">detrend, local anomaly, hysteresis, contours</text>

    <rect x="532" y="368" width="306" height="58" rx="5" fill="#fbfbf9" stroke="#dfe1dc"/>
    <text x="546" y="391" font-size="13" font-weight="600" fill="#1e2326">4  Track and project</text>
    <text x="546" y="411">DIS flow, 48-day advection-diffusion cone</text>

    <rect x="532" y="434" width="306" height="64" rx="5" fill="#fff6f3" stroke="#d23f1d"/>
    <text x="546" y="457" font-size="13" font-weight="600" fill="#1e2326">5  Risk and agent</text>
    <text x="546" y="477">LangGraph: plan, gather evidence, decide;</text>
    <text x="546" y="492">guard lets it close roads, never reopen</text>
  </g>

  <rect x="516" y="534" width="338" height="128" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
  <text x="532" y="558" font-size="13" font-weight="600" fill="#3f6e8c">API container: firewatch serve</text>
  <text x="532" y="582" font-size="12" fill="#59636a">FastAPI and a Leaflet dashboard: map layers,</text>
  <text x="532" y="599" font-size="12" fill="#59636a">hotspot traces, reroutes, approvals.</text>
  <text x="532" y="616" font-size="12" fill="#59636a">Reads the same S3 and DynamoDB state.</text>

  <text x="910" y="112" font-size="12" font-weight="600" fill="#59636a" letter-spacing="0.4">AWS services</text>
  <g font-size="12" fill="#59636a">
    <rect x="910" y="124" width="250" height="56" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="924" y="147" font-size="14" font-weight="600" fill="#1e2326">Amazon S3</text>
    <text x="924" y="167">layers with XMP, time-lapse, traces</text>

    <rect x="910" y="192" width="250" height="56" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="924" y="215" font-size="14" font-weight="600" fill="#1e2326">Amazon DynamoDB</text>
    <text x="924" y="235">runs, tracks, closures, approvals</text>

    <rect x="910" y="260" width="250" height="56" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="924" y="283" font-size="14" font-weight="600" fill="#1e2326">Amazon Bedrock</text>
    <text x="924" y="303">next-tool choice, alert wording</text>

    <rect x="910" y="328" width="250" height="56" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="924" y="351" font-size="14" font-weight="600" fill="#1e2326">Amazon SNS</text>
    <text x="924" y="371">closure and review alerts</text>

    <rect x="910" y="396" width="250" height="56" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="924" y="419" font-size="14" font-weight="600" fill="#1e2326">Amazon CloudWatch</text>
    <text x="924" y="439">agent trace logs, metrics</text>

    <rect x="910" y="464" width="250" height="56" rx="6" fill="#ffffff" stroke="#c4c8c2"/>
    <text x="924" y="487" font-size="14" font-weight="600" fill="#1e2326">AWS Secrets Manager</text>
    <text x="924" y="507">dashboard password</text>
  </g>

  <rect x="910" y="572" width="250" height="64" rx="32" fill="#1e2326"/>
  <text x="1035" y="598" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Safety officer</text>
  <text x="1035" y="618" font-size="12" fill="#dfe1dc" text-anchor="middle">gets alerts, approves reopening</text>

  <g stroke="#59636a" stroke-width="1.5" fill="none">
    <line x1="270" y1="244" x2="304" y2="244" marker-end="url(#arrow)"/>
    <line x1="466" y1="244" x2="514" y2="244" marker-end="url(#arrow)"/>
    <line x1="270" y1="156" x2="514" y2="156" marker-end="url(#arrow)"/>
    <line x1="270" y1="332" x2="514" y2="332" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
    <line x1="270" y1="420" x2="514" y2="420" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
    <line x1="854" y1="152" x2="908" y2="152" marker-end="url(#arrow)"/>
    <line x1="854" y1="220" x2="908" y2="220" marker-end="url(#arrow)"/>
    <line x1="854" y1="288" x2="908" y2="288" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="854" y1="356" x2="908" y2="356" marker-end="url(#arrow)"/>
    <line x1="854" y1="424" x2="908" y2="424" marker-end="url(#arrow)"/>
    <path d="M854 640 H882 V492 H908" marker-end="url(#arrow)"/>
    <path d="M1160 356 H1180 V604 H1162" marker-end="url(#arrow)"/>
  </g>
  <line x1="908" y1="604" x2="856" y2="604" stroke="#d23f1d" stroke-width="1.8" marker-start="url(#arrow-ember)" marker-end="url(#arrow-ember)"/>
  <g font-size="11" fill="#59636a">
    <text x="290" y="148">read COGs for each pass</text>
    <text x="290" y="324">agent tool: fetch_highres</text>
    <text x="290" y="412">baked into the image</text>
    <text x="1186" y="480" transform="rotate(90 1186 480)">email</text>
    <text x="864" y="588" fill="#d23f1d">decide</text>
  </g>
</svg>
