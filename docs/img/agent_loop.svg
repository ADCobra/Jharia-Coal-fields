<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636a"/>
    </marker>
    <marker id="arrow-ember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d23f1d"/>
    </marker>
  </defs>
  <rect width="1040" height="600" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1e2326">The agent loop for one pass</text>
  <text x="40" y="66" font-size="13" fill="#59636a">LangGraph nodes in bold. Every node writes a trace event: what it saw, what it chose and why.</text>

  <g font-size="12" fill="#59636a">
    <rect x="40" y="100" width="200" height="74" rx="8" fill="#f1f2ef" stroke="#c4c8c2"/>
    <text x="56" y="126" font-size="14" font-weight="700" fill="#1e2326">perceive</text>
    <text x="56" y="146">LST, hotspots, tracks, cones,</text>
    <text x="56" y="162">risk and confidence per hotspot</text>

    <rect x="300" y="100" width="200" height="74" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
    <text x="316" y="126" font-size="14" font-weight="700" fill="#1e2326">next_case</text>
    <text x="316" y="146">riskiest open hotspot first;</text>
    <text x="316" y="162">low, remote ones are just logged</text>

    <rect x="560" y="100" width="200" height="74" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
    <text x="576" y="126" font-size="14" font-weight="700" fill="#1e2326">plan</text>
    <text x="576" y="146">picks a tool, by policy</text>
    <text x="576" y="162">or with Amazon Bedrock</text>

    <rect x="810" y="84" width="200" height="236" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
    <text x="826" y="110" font-size="14" font-weight="700" fill="#1e2326">use_tool</text>
    <text x="826" y="136" font-weight="600" fill="#1e2326">check_industrial</text>
    <text x="826" y="152">plant map, footprint shape, VLM</text>
    <text x="826" y="176" font-weight="600" fill="#1e2326">fetch_history</text>
    <text x="826" y="192">was it in older Landsat passes?</text>
    <text x="826" y="216" font-weight="600" fill="#1e2326">refine_alignment</text>
    <text x="826" y="232">DISK settles a disagreement</text>
    <text x="826" y="256" font-weight="600" fill="#1e2326">fetch_highres</text>
    <text x="826" y="272">hot pixels in Sentinel-2 SWIR</text>
    <text x="826" y="296" font-weight="600" fill="#1e2326">request_drone</text>
    <text x="826" y="312">file a survey (simulated)</text>

    <rect x="560" y="262" width="200" height="74" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
    <text x="576" y="288" font-size="14" font-weight="700" fill="#1e2326">decide</text>
    <text x="576" y="308">exclude, close, escalate or log,</text>
    <text x="576" y="324">from risk, confidence, distance</text>

    <rect x="560" y="410" width="200" height="94" rx="8" fill="#fff6f3" stroke="#d23f1d"/>
    <text x="576" y="436" font-size="14" font-weight="600" fill="#1e2326">guard, inside act</text>
    <text x="576" y="456">closes only for high risk,</text>
    <text x="576" y="472">confidence 0.7 or more, fire</text>
    <text x="576" y="488">within 250 m; never reopens</text>

    <rect x="300" y="410" width="200" height="94" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
    <text x="316" y="436" font-size="14" font-weight="700" fill="#1e2326">act</text>
    <text x="316" y="456">close segments, reroute,</text>
    <text x="316" y="472">alert by SNS, or open a review</text>
    <text x="316" y="488">for a person</text>

    <rect x="40" y="262" width="200" height="94" rx="8" fill="#ffffff" stroke="#3f6e8c"/>
    <text x="56" y="288" font-size="14" font-weight="700" fill="#1e2326">review_closures</text>
    <text x="56" y="308">a closed road whose fire stayed</text>
    <text x="56" y="324">quiet for 2 passes gets a</text>
    <text x="56" y="340">reopen proposal</text>

    <rect x="40" y="430" width="200" height="74" rx="37" fill="#1e2326"/>
    <text x="140" y="462" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Safety officer</text>
    <text x="140" y="482" fill="#dfe1dc" text-anchor="middle">the only one who can reopen</text>
  </g>

  <g stroke="#59636a" stroke-width="1.5" fill="none">
    <line x1="240" y1="137" x2="298" y2="137" marker-end="url(#arrow)"/>
    <line x1="500" y1="137" x2="558" y2="137" marker-end="url(#arrow)"/>
    <line x1="760" y1="124" x2="808" y2="124" marker-end="url(#arrow)"/>
    <path d="M808 210 H785 V160 H762" marker-end="url(#arrow)"/>
    <line x1="660" y1="174" x2="660" y2="260" marker-end="url(#arrow)"/>
    <line x1="660" y1="336" x2="660" y2="408" marker-end="url(#arrow)"/>
    <line x1="560" y1="457" x2="502" y2="457" marker-end="url(#arrow)"/>
    <line x1="400" y1="410" x2="400" y2="176" marker-end="url(#arrow)"/>
    <path d="M300 160 H270 V309 H242" marker-end="url(#arrow)"/>
    <line x1="140" y1="356" x2="140" y2="428" marker-end="url(#arrow)"/>
  </g>

  <g font-size="11" fill="#59636a">
    <text x="148" y="398">proposal</text>
    <text x="772" y="200" text-anchor="end">rescore, ask again</text>
    <text x="668" y="222">no tool would</text>
    <text x="668" y="236">change it</text>
    <text x="668" y="380">proposed action</text>
    <text x="506" y="449">allowed</text>
    <text x="408" y="300">next hotspot</text>
    <text x="276" y="232" transform="rotate(90 276 232)">queue empty</text>
  </g>

  <text x="40" y="560" font-size="12" fill="#59636a">Tool results change confidence (history +0.15, Sentinel-2 hot pixels +0.10, third matcher agreeing +0.15, plant ruled out +0.05 to +0.15).</text>
  <text x="40" y="578" font-size="12" fill="#59636a">The step budget is 5 tools per hotspot. A planner that names anything outside the offered tools is overruled.</text>
</svg>
