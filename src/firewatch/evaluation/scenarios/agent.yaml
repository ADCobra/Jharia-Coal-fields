- id: D02
  group: Watch quietly when nothing is at stake
  name: Weak, stable fire 1.8 km away
  hotspot: {x_m: -1500, gap_m: 1800, radius_m: 70, mean_k: 4.5, max_k: 7.0}
  track: {points: 6}
  expect: {decision: log, tools: []}

