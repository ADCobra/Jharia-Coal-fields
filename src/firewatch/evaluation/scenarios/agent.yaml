  group: Watch quietly when nothing is at stake
  name: New weak hotspot 900 m from the road
  hotspot: {x_m: -1500, gap_m: 900, radius_m: 60, mean_k: 5.0, max_k: 8.0}
  track: {points: 1}
  world: {history: new}
  expect: {decision: log, tools: [fetch_history]}

- id: D04
  group: Watch quietly when nothing is at stake
  name: Cloud-edge hotspot 1.5 km from the road
  hotspot: {x_m: -1500, gap_m: 1500, radius_m: 70, mean_k: 5.0, max_k: 8.0, cloud_edge: 0.5}
  track: {points: 3}
  expect: {decision: log, tools: []}

- id: E01
  group: Remember what was already done
  name: Fire still hot next to roads the agent closed earlier
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {highres: confirmed}
  pre_closed: auto
  expect: {decision: close, notifications: 0, actions_include: [keep_closed]}

- id: E02
  group: Remember what was already done
  name: Moderate case with a review already waiting for this track
  hotspot: {gap_m: 150, radius_m: 80, mean_k: 8.0, max_k: 14.0}
  track: {points: 1}
  world: {history: new, highres: confirmed}
  pending_review: medium
  expect: {decision: escalate, notifications: 0, pending: {review_hotspot: 1}}

- id: E03
  group: Remember what was already done
  name: Waiting review, and the hotspot has become high risk
  hotspot: {gap_m: 10, mean_k: 12.0, max_k: 24.0}
  track: {points: 1}
  alignment: {ok: false}
  world: {history: new, realign: fail, highres: confirmed}
  pending_review: medium
  expect: {decision: escalate, notifications: 1, pending: {review_hotspot: 1}}

- id: F01
  group: Survive a misbehaving planner
  name: Language model asks for a tool that does not exist (close_road)
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {highres: confirmed}
  planner: {kind: llm, replies: ['{"tool": "close_road", "rationale": "close it now"}']}
  expect: {decision: close, tools: [fetch_highres], planner_used: policy-fallback}

- id: F02
  group: Survive a misbehaving planner
  name: Language model replies with prose instead of JSON
  hotspot: {gap_m: 150, radius_m: 80, mean_k: 8.0, max_k: 14.0}
  track: {points: 1}
  world: {history: new, highres: confirmed}
  planner: {kind: llm, replies: ["Sure! Let's look at older passes first."]}
  expect: {decision: escalate, tools: [fetch_history, fetch_highres], planner_used: policy-fallback}

- id: F03
  group: Survive a misbehaving planner
  name: Language model picks a different but valid order
  hotspot: {gap_m: 150, radius_m: 80, mean_k: 8.0, max_k: 14.0}
  track: {points: 1}
  world: {history: new, highres: confirmed}
  planner: {kind: llm, replies: ['{"tool": "fetch_highres", "rationale": "check Sentinel-2 first"}']}
  expect: {decision: escalate, tools: [fetch_highres, fetch_history]}

- id: F04
  group: Survive a misbehaving planner
  name: Planner returns an action instead of a tool
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {highres: confirmed}
  planner: {kind: rogue, tool: close_road}
  expect: {decision: close, tools: [fetch_highres], planner_used: guard}

- id: F05
  group: Survive a misbehaving planner
  name: Step budget of two tools on a case that wants four
  hotspot: {gap_m: 10, mean_k: 12.0, max_k: 24.0, cloud_edge: 0.2}
  track: {points: 1}
  alignment: {ok: false}
  world: {history: new, realign: fail, highres: confirmed}
  settings: {agent: {max_steps_per_hotspot: 2}}
  expect: {decision: escalate, max_tools: 2}
