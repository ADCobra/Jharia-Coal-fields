# Decision scenarios for the road-safety agent.
#
# Geometry: a straight main road runs east-west along y = 0 (segments M-00..M-07,
# 500 m each, x from -2000 to 2000). A bypass runs parallel 1.5 km south, joined
# by connectors at both ends, so closing the main road forces a detour. A haul
# road (H-00..H-03) runs north from x = 1000. Hotspots are circles north of the
# main road; gap_m is the distance from the circle's edge to the road.
#
# expect.decision is what a careful mine-safety officer would want, written from
# the situation, not from the code. world says what each tool would find.
# Defaults: x_m 250, radius_m 90, rectangularity 0.62, solidity 0.82,
# alignment ok with 0.3 px residual, scene cloud 5 %.

- id: A01
  group: Act on near-term, well-evidenced threats
  name: Growing fire 120 m from the main road, moving toward it
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {history: persistent, highres: confirmed}
  expect: {decision: close, tools: [fetch_highres]}

- id: A02
  group: Act on near-term, well-evidenced threats
  name: Intense, stable fire at the road edge; Sentinel-2 sees nothing
  hotspot: {gap_m: 20, radius_m: 110, mean_k: 12.0, max_k: 22.0}
  track: {points: 4, growth_30d: 0.1}
  world: {highres: not_confirmed}
  expect: {decision: close, tools: [fetch_highres]}
  note: Smouldering subsurface fires are often too cool for Sentinel-2 shortwave infrared, so a negative check does not lower confidence.

- id: A03
  group: Act on near-term, well-evidenced threats
  name: Fire at the junction of the main road and a haul road
  hotspot: {x_m: 1130, gap_m: 40, radius_m: 80, mean_k: 10.0, max_k: 18.0}
  track: {points: 3, growth_30d: 0.25, approach: 1.0}
  world: {highres: confirmed}
  expect: {decision: close, segments_include: [H-00, M-05, M-06]}

- id: A04
  group: Act on near-term, well-evidenced threats
  name: Fast fire 500 m away; only the 48-day projection reaches the road
  hotspot: {gap_m: 500, radius_m: 100, mean_k: 7.0, max_k: 12.0}
  track: {points: 3, growth_30d: 0.2, approach: 8.0}
  world: {highres: confirmed}
  expect: {decision: escalate, segments_include: [M-04]}
  note: The next satellite pass comes before the fire can reach the road, so a pre-emptive closure should be a person's call, with the projected segments as the recommendation.

- id: A05
  group: Act on near-term, well-evidenced threats
  name: Image alignment failed, a second method recovers it
  hotspot: {gap_m: 80, mean_k: 10.0, max_k: 18.0}
  track: {points: 3, growth_30d: 0.3, approach: 1.5}
  alignment: {ok: false}
  world: {realign: ok, highres: confirmed}
  expect: {decision: close, tools: [refine_alignment, fetch_highres]}

- id: A06
  group: Act on near-term, well-evidenced threats
  name: First sighting at the road, alignment failed twice
  hotspot: {gap_m: 10, mean_k: 12.0, max_k: 24.0}
  track: {points: 1}
  alignment: {ok: false}
  world: {history: new, realign: fail, highres: confirmed}
  expect: {decision: escalate, tools: [fetch_history, refine_alignment, fetch_highres]}

- id: A07
  group: Act on near-term, well-evidenced threats
  name: First sighting at the road, second alignment method succeeds
  hotspot: {gap_m: 10, mean_k: 12.0, max_k: 24.0}
  track: {points: 1}
  alignment: {ok: false}
  world: {history: new, realign: ok, highres: confirmed}
  expect: {decision: close, tools: [fetch_history, refine_alignment, fetch_highres]}

- id: A08
  group: Act on near-term, well-evidenced threats
  name: SIFT and ALIKED + LightGlue disagree; DISK sides with SIFT
  hotspot: {gap_m: 80, mean_k: 10.0, max_k: 18.0}
  track: {points: 3, growth_30d: 0.3, approach: 1.5}
  alignment: {ok: true, agreement_px: 1.4}
  world: {realign: ok, highres: confirmed}
  expect: {decision: close, tools: [refine_alignment, fetch_highres]}

- id: A09
  group: Act on near-term, well-evidenced threats
  name: Matchers disagree, DISK sides with ALIKED, no Sentinel-2 image
  hotspot: {gap_m: 80, mean_k: 10.0, max_k: 18.0}
  track: {points: 3, growth_30d: 0.3, approach: 1.5}
  alignment: {ok: true, agreement_px: 1.4}
  world: {realign: disagree, highres: unavailable}
  expect: {decision: escalate, tools: [refine_alignment, fetch_highres, request_drone], drone: true}
  note: The alignment used is probably off by more than a pixel, which also corrupts the measured motion, and nothing independent confirms the fire. A person decides, and a drone survey is requested.

- id: A10
  group: Act on near-term, well-evidenced threats
  name: Matchers disagree, DISK sides with ALIKED, Sentinel-2 confirms the fire
  hotspot: {gap_m: 80, mean_k: 10.0, max_k: 18.0}
  track: {points: 3, growth_30d: 0.3, approach: 1.5}
  alignment: {ok: true, agreement_px: 1.4}
  world: {realign: disagree, highres: confirmed}
  expect: {decision: close, tools: [refine_alignment, fetch_highres]}
  note: A 40 m position doubt does not change whether a confirmed fire 80 m from the road is inside the 250 m closure buffer.

- id: A11
  group: Act on near-term, well-evidenced threats
  name: Fire beside a mine haul road when the agent may close only haul roads by itself
  hotspot: {x_m: 1150, gap_m: 600, radius_m: 80, mean_k: 10.0, max_k: 18.0}
  track: {points: 3, growth_30d: 0.25, approach: 1.0}
  world: {highres: confirmed}
  settings: {roads: {auto_close: haul}}
  expect: {decision: close, segments_include: [H-01]}

- id: B01
  group: Hand uncertain or moderate cases to a person
  name: New hotspot 150 m from the road, nothing there in earlier passes
  hotspot: {gap_m: 150, radius_m: 80, mean_k: 8.0, max_k: 14.0}
  track: {points: 1}
  world: {history: new, highres: confirmed}
  expect: {decision: escalate, tools: [fetch_history, fetch_highres]}

- id: B02
  group: Hand uncertain or moderate cases to a person
  name: Approaching fire half hidden by cloud, no Sentinel-2 image
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0, cloud_edge: 0.4}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {history: persistent, highres: unavailable}
  expect: {decision: escalate, tools: [fetch_highres, request_drone], drone: true}

- id: B03
  group: Hand uncertain or moderate cases to a person
  name: Moderate, slow fire 300 m from the road
  hotspot: {gap_m: 300, mean_k: 6.0, max_k: 10.0}
  track: {points: 5, growth_30d: 0.15, approach: 0.4}
  world: {highres: not_confirmed}
  expect: {decision: escalate}

- id: B04
  group: Hand uncertain or moderate cases to a person
  name: Same fire as A01 with automatic closure switched off
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {highres: confirmed}
  settings: {agent: {allow_auto_close: false}}
  expect: {decision: escalate, closed: []}

- id: B05
  group: Hand uncertain or moderate cases to a person
  name: High risk by the main road while only haul roads may be closed
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {highres: confirmed}
  settings: {roads: {haul_only_closures: true}}
  expect: {decision: escalate, closed: []}

- id: B06
  group: Hand uncertain or moderate cases to a person
  name: Weak, stable heat directly under the road
  hotspot: {gap_m: -40, mean_k: 4.5, max_k: 7.0}
  track: {points: 4}
  world: {highres: not_confirmed}
  expect: {decision: escalate}
  note: Weak heat under a road still means a hollowing seam; collapse risk needs eyes on the ground.

- id: B07
  group: Hand uncertain or moderate cases to a person
  name: Faint new hotspot near the road on a cloudy, misaligned pass
  hotspot: {gap_m: 300, radius_m: 70, mean_k: 4.2, max_k: 6.5}
  track: {points: 1}
  alignment: {ok: false}
  scene_cloud: 0.6
  world: {history: new, realign: fail, highres: not_confirmed}
  expect: {decision: escalate}

- id: B08
  group: Hand uncertain or moderate cases to a person
  name: Same faint hotspot, but the second alignment method succeeds
  hotspot: {gap_m: 300, radius_m: 70, mean_k: 4.2, max_k: 6.5}
  track: {points: 1}
  alignment: {ok: false}
  scene_cloud: 0.6
  world: {history: new, realign: ok, highres: not_confirmed}
  expect: {decision: log}

- id: B09
  group: Hand uncertain or moderate cases to a person
  name: Strong, persistent fire 60 m from the road with no measured spread
  hotspot: {gap_m: 60, mean_k: 10.0, max_k: 20.0}
  track: {points: 4}
  world: {highres: confirmed}
  expect: {decision: escalate}

- id: B10
  group: Hand uncertain or moderate cases to a person
  name: Same fire as A01 when the agent may close only haul roads by itself
  hotspot: {gap_m: 120, mean_k: 9.0, max_k: 16.0}
  track: {points: 3, growth_30d: 0.3, approach: 2.0}
  world: {history: persistent, highres: confirmed}
  settings: {roads: {auto_close: haul}}
  expect: {decision: escalate, closed: []}
  note: On real Jharia data the agent closes mine haul roads on its own; a public road always goes to a person.

- id: C01
  group: Reject false heat
  name: Coke-oven battery on the industrial map
  hotspot: {gap_m: 200, radius_m: 50, mean_k: 18.0, max_k: 32.0, industrial_overlap: 0.95, rectangularity: 0.92, solidity: 0.95}
  track: {points: 4}
  expect: {decision: exclude, tools: [check_industrial]}

- id: C02
  group: Reject false heat
  name: Unmapped plant; the vision-language model sees a chimney
  hotspot: {gap_m: 300, radius_m: 60, mean_k: 15.0, max_k: 26.0, rectangularity: 0.88, solidity: 0.93}
  track: {points: 1}
  world: {vlm: "yes", history: persistent}
  expect: {decision: exclude, tools: [check_industrial]}

- id: C03
  group: Reject false heat
  name: Hot rectangular patch; the vision-language model sees no building
  hotspot: {gap_m: 300, radius_m: 60, mean_k: 15.0, max_k: 26.0, rectangularity: 0.88, solidity: 0.93}
  track: {points: 1}
  world: {vlm: "no", history: persistent, highres: not_confirmed}
  expect: {decision: escalate}

- id: C04
  group: Reject false heat
  name: Unmapped plant with no vision-language model available
  hotspot: {gap_m: 300, radius_m: 60, mean_k: 15.0, max_k: 26.0, rectangularity: 0.88, solidity: 0.93}
  track: {points: 1}
  world: {history: persistent, highres: not_confirmed}
  expect: {decision: exclude}
  note: Known limitation. Shape and heat alone cannot separate an unmapped plant from a fire, so the agent sends it to a person (a false alarm, not a missed fire).

- id: C05
  group: Reject false heat
  name: Real fire straddling the edge of a mapped coke plant
  hotspot: {gap_m: 100, mean_k: 8.0, max_k: 15.0, industrial_overlap: 0.35, rectangularity: 0.55, solidity: 0.78}
  track: {points: 3, growth_30d: 0.3, approach: 1.5}
  world: {highres: confirmed}
  expect: {decision: close}
  note: Jharia has fires right next to coke plants. Touching an industrial polygon must not be enough to ignore a hotspot.

- id: D01
  group: Watch quietly when nothing is at stake
  name: Strong fire 2.5 km from any road
  hotspot: {x_m: -1500, gap_m: 2500, radius_m: 100, mean_k: 12.0, max_k: 24.0}
  track: {points: 5, growth_30d: 0.05}
